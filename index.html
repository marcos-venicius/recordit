<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:">
  <title>RecordIt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1><span class="dot"></span>RecordIt</h1>

    <div class="field">
      <label for="folder">Pasta de destino</label>
      <div class="row">
        <input id="folder" readonly>
        <button id="pickFolder">Escolher…</button>
      </div>
    </div>

    <div class="field">
      <label for="name">Nome do arquivo</label>
      <input id="name" placeholder="Opcional — padrão: app_data_hora" spellcheck="false">
    </div>

    <div class="field">
      <label for="format">Formato</label>
      <select id="format"></select>
    </div>

    <div class="field">
      <label for="pickSource">O que gravar</label>
      <div class="row">
        <button id="pickSource">Escolher janela ou tela…</button>
        <span id="sourceName" class="muted ellipsis">Nenhuma fonte selecionada</span>
      </div>
      <div id="sources" class="grid" hidden></div>
      <video id="preview" muted autoplay hidden></video>
    </div>

    <button id="record" class="primary" disabled>● Gravar</button>

    <div class="row">
      <p id="status" class="muted ellipsis"></p>
      <button id="showFile" hidden>Mostrar arquivo</button>
    </div>
  </main>
  <script src="node_modules/fix-webm-duration/fix-webm-duration.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
